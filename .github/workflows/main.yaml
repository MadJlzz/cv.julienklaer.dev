name: Deploy redirect

# cv.julienklaer.dev now lives at https://www.julienklaer.dev/cv/.
# This repo only serves a page that forwards visitors there.

on:
  push:
    branches: [sources]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./site
          force_orphan: true
